<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Dashboard — Vidya Vriksh Portal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B3%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/assets/admin.css" />
</head>
<body>
  <div class="wrap">
    <div class="page-head">
      <div><h1 data-i18n="a.dash.title">Dashboard</h1><p id="welcome" class="muted"></p></div>
      <div class="row"><button class="help-btn" id="helpBtn" type="button" data-i18n="a.howto">❔ How to use</button>
        <a class="btn btn--primary" href="/admin/students" data-i18n="a.dash.manage">+ Manage Students</a></div>
    </div>

    <div class="cards" id="stats"></div>

    <div class="page-head mt"><h1 style="font-size:1.3rem" data-i18n="a.dash.yourStudents">Your students</h1>
      <a class="btn btn--ghost btn--sm" href="/admin/students" data-i18n="a.viewAll">View all</a></div>
    <div class="table-card">
      <div class="table-wrap">
        <table class="data">
          <thead><tr><th data-i18n="a.th.name">Name</th><th data-i18n="a.th.class">Class</th><th data-i18n="a.th.tests">Tests</th><th data-i18n="a.th.avg">Average</th><th></th></tr></thead>
          <tbody id="rows"><tr><td colspan="5" class="empty">…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/admin/assets/tour.js"></script>
  <script src="/admin/assets/admin.js"></script>
  <script>
    (async () => {
      const me = await initShell("/admin/");
      if (!me) return;
      document.getElementById("welcome").textContent = tr("a.dash.welcome") + " " + me.name + ".";

      const menuStep = isMobile()
        ? { emoji: "🧭", title: tr("a.tour.menuT"), body: tr("a.tour.menuMobileB"), target: () => document.getElementById("menuBtn") }
        : { emoji: "🧭", title: tr("a.tour.menuT"), body: tr("a.tour.menuDeskB"), target: () => document.getElementById("topnav") };
      const teacherSteps = [
        { emoji: "👋", title: tr("a.tour.welcomeT"), body: tr("a.tour.welcomeB") },
        menuStep,
        { emoji: "📊", title: tr("a.tour.overviewT"), body: tr("a.tour.overviewB"), target: () => document.getElementById("stats") },
        { emoji: "🧑‍🎓", title: tr("a.tour.studentsT"), body: tr("a.tour.studentsB"), target: () => document.querySelector('.page-head a[href="/admin/students"]') },
        { emoji: "❔", title: tr("a.tour.replayT"), body: tr("a.tour.replayB"), target: () => document.getElementById("helpBtn") },
        { emoji: "📝", title: tr("a.tour.testsT"), body: tr("a.tour.testsB") },
        { emoji: "👪", title: tr("a.tour.reportsT"), body: tr("a.tour.reportsB") },
        { emoji: "⚙️", title: tr("a.tour.settingsT"), body: tr("a.tour.settingsB") },
      ];
      document.getElementById("helpBtn").addEventListener("click", () => startTour("teacher_v2", teacherSteps, { force: true }));

      const [students, tests, teachers] = await Promise.all([
        api("/api/students"), api("/api/tests"), api("/api/teachers"),
      ]);
      const avg = students.filter(s => s.tests > 0);
      const overall = avg.length ? Math.round(avg.reduce((a, s) => a + s.average, 0) / avg.length) : 0;

      document.getElementById("stats").innerHTML = `
        <div class="card stat"><span class="stat__num">${students.length}</span><span class="stat__label">${tr("a.stat.students")}</span></div>
        <div class="card stat"><span class="stat__num">${tests.length}</span><span class="stat__label">${tr("a.stat.tests")}</span></div>
        <div class="card stat"><span class="stat__num">${overall}%</span><span class="stat__label">${tr("a.stat.avg")}</span></div>
        <div class="card stat"><span class="stat__num">${teachers.length}</span><span class="stat__label">${tr("a.stat.teachers")}</span></div>`;

      startTour("teacher_v2", teacherSteps);  // spotlight tour once the page has rendered

      const rows = document.getElementById("rows");
      if (!students.length) { rows.innerHTML = `<tr><td colspan="5" class="empty">${tr("a.dash.noStudents")} <a href="/admin/students">${tr("a.dash.addFirst")}</a>.</td></tr>`; return; }
      rows.innerHTML = students.slice(0, 8).map(s => `
        <tr>
          <td><strong>${escapeHtml(s.name)}</strong></td>
          <td>${escapeHtml(s.className) || "—"}</td>
          <td>${s.tests}</td>
          <td><span class="pill ${pillClass(s.average)}">${s.tests ? s.average + "%" : "—"}</span></td>
          <td><a class="btn btn--sage btn--sm" href="/admin/student?id=${s.id}">${tr("a.open")}</a></td>
        </tr>`).join("");
    })().catch(e => toast(e.error || (aLang() === "te" ? "ఏదో తప్పు జరిగింది" : "Something went wrong"), true));
  </script>
</body>
</html>
