<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Dashboard — Vidya Vriksh Portal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B3%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/assets/admin.css" />
</head>
<body>
  <div class="wrap">
    <div class="page-head">
      <div><h1>Dashboard</h1><p id="welcome" class="muted"></p></div>
      <div class="row"><button class="help-btn" id="helpBtn" type="button">❔ How to use</button>
        <a class="btn btn--primary" href="/admin/students">+ Manage Students</a></div>
    </div>

    <div class="cards" id="stats"></div>

    <div class="page-head mt"><h1 style="font-size:1.3rem">Your students</h1>
      <a class="btn btn--ghost btn--sm" href="/admin/students">View all</a></div>
    <div class="table-card">
      <div class="table-wrap">
        <table class="data">
          <thead><tr><th>Name</th><th>Class</th><th>Tests</th><th>Average</th><th></th></tr></thead>
          <tbody id="rows"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/admin/assets/tour.js"></script>
  <script src="/admin/assets/admin.js"></script>
  <script>
    (async () => {
      const me = await initShell("/admin/");
      if (!me) return;
      document.getElementById("welcome").textContent = "Welcome back, " + me.name + ".";

      const navTip = isMobile()
        ? "Tap the <strong>☰ menu</strong> (top-right) to move between pages."
        : "Use the <strong>menu at the top</strong> to move between pages.";
      const teacherSteps = [
        { emoji: "👋", title: "Welcome to your portal", body: "This is where you manage students, record test marks, and share progress with parents. Here's a quick tour — you can tap <strong>Skip</strong> anytime." },
        { emoji: "🧭", title: "Getting around", body: navTip + " The pages are <strong>Dashboard, Students, Tests, Teachers</strong> and <strong>Settings</strong>." },
        { emoji: "🧑‍🎓", title: "1 · Add your students", body: "Open <strong>Students → + Add Student</strong>. Add the child's name, class, and the <strong>parent's email</strong> (needed for reports and the parent login)." },
        { emoji: "📝", title: "2 · Create tests", body: "Open <strong>Tests → + Add Test</strong> and enter each test's name, subject, date and maximum marks." },
        { emoji: "✍️", title: "3 · Record marks", body: "Open a student and scroll to <strong>Record marks</strong>. Type a score and click away — it <strong>saves automatically</strong>." },
        { emoji: "📊", title: "4 · See progress", body: "Each student page shows their <strong>average, charts and trend</strong>. Tap <strong>✉️ Email report to parent</strong> to send it by email." },
        { emoji: "👪", title: "5 · Give parents a login", body: "On a student's page, set a password under <strong>Parent login access</strong> and share it — parents sign in at <strong>hrm99.com/parent</strong> to view progress." },
        { emoji: "⚙️", title: "Settings & help", body: "In <strong>Settings</strong> you can change your password and connect the sending email. Tap <strong>❔ How to use</strong> anytime to replay this, or open the <a href='/guide' target='_blank'>full guide</a>." },
      ];
      startTour("teacher_v1", teacherSteps);
      document.getElementById("helpBtn").addEventListener("click", () => startTour("teacher_v1", teacherSteps, { force: true }));

      const [students, tests, teachers] = await Promise.all([
        api("/api/students"), api("/api/tests"), api("/api/teachers"),
      ]);
      const avg = students.filter(s => s.tests > 0);
      const overall = avg.length ? Math.round(avg.reduce((a, s) => a + s.average, 0) / avg.length) : 0;

      document.getElementById("stats").innerHTML = `
        <div class="card stat"><span class="stat__num">${students.length}</span><span class="stat__label">Students</span></div>
        <div class="card stat"><span class="stat__num">${tests.length}</span><span class="stat__label">Tests created</span></div>
        <div class="card stat"><span class="stat__num">${overall}%</span><span class="stat__label">Class average</span></div>
        <div class="card stat"><span class="stat__num">${teachers.length}</span><span class="stat__label">Teachers</span></div>`;

      const rows = document.getElementById("rows");
      if (!students.length) { rows.innerHTML = `<tr><td colspan="5" class="empty">No students yet. <a href="/admin/students">Add your first student</a>.</td></tr>`; return; }
      rows.innerHTML = students.slice(0, 8).map(s => `
        <tr>
          <td><strong>${escapeHtml(s.name)}</strong></td>
          <td>${escapeHtml(s.className) || "—"}</td>
          <td>${s.tests}</td>
          <td><span class="pill ${pillClass(s.average)}">${s.tests ? s.average + "%" : "—"}</span></td>
          <td><a class="btn btn--sage btn--sm" href="/admin/student?id=${s.id}">Open</a></td>
        </tr>`).join("");
    })().catch(e => toast(e.error || "Something went wrong", true));
  </script>
</body>
</html>
