<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Students — Milestone Tuitions Portal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B3%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/assets/admin.css" />
</head>
<body>
  <div class="wrap">
    <div class="page-head">
      <div><h1 data-i18n="a.students.title">Students</h1><p data-i18n="a.students.sub">Add and manage the students in your batch.</p></div>
      <button class="btn btn--primary" id="addBtn" data-i18n="a.addStudent">+ Add Student</button>
    </div>

    <div class="table-card">
      <div class="table-wrap">
        <table class="data">
          <thead><tr><th data-i18n="a.th.name">Name</th><th data-i18n="a.th.class">Class</th><th data-i18n="a.th.parent">Parent</th><th data-i18n="a.th.phone">Phone</th><th data-i18n="a.th.tests">Tests</th><th data-i18n="a.th.avg">Average</th><th></th></tr></thead>
          <tbody id="rows"><tr><td colspan="7" class="empty">…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Add/Edit modal -->
  <div class="modal" id="modal">
    <div class="modal__box">
      <h2 id="modalTitle" data-i18n="a.modal.addStudent">Add Student</h2>
      <form id="studentForm">
        <input type="hidden" id="sid" />
        <div class="form-grid">
          <div class="field"><label for="name" data-i18n="a.f.studentNameReq">Student's name *</label><input id="name" required /></div>
          <div class="field"><label for="className" data-i18n="a.f.className">Class</label>
            <select id="className"><option value="">—</option><option>Pre-KG</option><option>Class 1</option><option>Class 2</option><option>Class 3</option><option>Class 4</option><option>Class 5</option><option>Class 6</option><option>Class 7</option><option>Class 8</option><option>Class 9</option><option>Class 10</option><option>Class 11 (Inter)</option><option>Class 12 (Inter)</option><option>Spoken English</option></select></div>
          <div class="field"><label for="parentName" data-i18n="a.f.parentName">Parent's name</label><input id="parentName" /></div>
          <div class="field"><label for="parentPhone" data-i18n="a.f.parentPhone">Parent's phone</label><input id="parentPhone" /></div>
          <div class="field field--full"><label for="parentEmail" data-i18n="a.f.parentEmail">Parent's email (for reports)</label><input id="parentEmail" type="email" placeholder="parent@example.com" /></div>
          <div class="field field--full"><label for="notes" data-i18n="a.f.notes">Notes</label><textarea id="notes" rows="2"></textarea></div>
        </div>
        <div class="modal__actions">
          <button type="button" class="btn btn--ghost" onclick="closeModal('modal')" data-i18n="a.cancel">Cancel</button>
          <button type="submit" class="btn btn--primary" id="saveBtn" data-i18n="a.save">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/admin/assets/admin.js"></script>
  <script>
    let students = [];
    async function load() {
      students = await api("/api/students");
      const rows = document.getElementById("rows");
      if (!students.length) { rows.innerHTML = `<tr><td colspan="7" class="empty">${tr("a.students.none")}</td></tr>`; return; }
      rows.innerHTML = students.map(s => `
        <tr>
          <td><a href="/admin/student?id=${s.id}"><strong>${escapeHtml(s.name)}</strong></a></td>
          <td>${escapeHtml(s.className) || "—"}</td>
          <td>${escapeHtml(s.parentName) || "—"}</td>
          <td>${escapeHtml(s.parentPhone) || "—"}</td>
          <td>${s.tests}</td>
          <td><span class="pill ${pillClass(s.average)}">${s.tests ? s.average + "%" : "—"}</span></td>
          <td class="actions">
            <a class="btn btn--sage btn--sm" href="/admin/student?id=${s.id}">${tr("a.open")}</a>
            <button class="btn btn--ghost btn--sm" onclick="edit(${s.id})">${tr("a.edit")}</button>
            <button class="btn btn--danger btn--sm" onclick="del(${s.id},'${escapeHtml(s.name).replace(/'/g,"\\'")}')">✕</button>
          </td>
        </tr>`).join("");
    }
    function openForm(s) {
      document.getElementById("modalTitle").textContent = s ? tr("a.modal.editStudent") : tr("a.modal.addStudent");
      document.getElementById("sid").value = s ? s.id : "";
      document.getElementById("name").value = s ? s.name : "";
      document.getElementById("className").value = s ? s.className : "";
      document.getElementById("parentName").value = s ? s.parentName : "";
      document.getElementById("parentPhone").value = s ? s.parentPhone : "";
      document.getElementById("parentEmail").value = s ? s.parentEmail : "";
      document.getElementById("notes").value = s ? s.notes : "";
      openModal("modal");
    }
    window.edit = (id) => openForm(students.find(s => s.id === id));
    window.del = async (id, name) => {
      const msg = aLang() === "te" ? `${name}ను తొలగించాలా? వారి మార్కులు కూడా తొలగించబడతాయి.` : `Remove ${name}? This also deletes their marks.`;
      if (!confirm(msg)) return;
      await api(`/api/students/${id}`, { method: "DELETE" });
      toast(aLang() === "te" ? "విద్యార్థి తొలగించబడ్డారు" : "Student removed"); load();
    };
    document.getElementById("addBtn").addEventListener("click", () => openForm(null));
    document.getElementById("studentForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("sid").value;
      const body = {
        name: document.getElementById("name").value, className: document.getElementById("className").value,
        parentName: document.getElementById("parentName").value, parentPhone: document.getElementById("parentPhone").value,
        parentEmail: document.getElementById("parentEmail").value, notes: document.getElementById("notes").value,
      };
      try {
        if (id) await api(`/api/students/${id}`, { method: "PUT", body });
        else await api("/api/students", { method: "POST", body });
        closeModal("modal"); toast(aLang() === "te" ? "సేవ్ అయింది" : "Saved"); load();
      } catch (ex) { toast(ex.error || (aLang() === "te" ? "సేవ్ చేయలేకపోయాం" : "Could not save"), true); }
    });
    (async () => { if (await initShell("/admin/students")) load(); })();
  </script>
</body>
</html>
