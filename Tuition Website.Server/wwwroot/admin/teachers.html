<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Teachers — Vidya Vriksh Portal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B3%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/assets/admin.css" />
</head>
<body>
  <div class="wrap">
    <div class="page-head">
      <div><h1>Teachers</h1><p>Anyone here can add another teacher. Each teacher manages their own students.</p></div>
      <button class="btn btn--primary" id="addBtn">+ Add Teacher</button>
    </div>

    <div class="table-card">
      <div class="table-wrap">
        <table class="data">
          <thead><tr><th>Name</th><th>Email</th><th>Students</th><th></th></tr></thead>
          <tbody id="rows"><tr><td colspan="4" class="empty">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal__box">
      <h2>Add Teacher</h2>
      <form id="teacherForm">
        <div class="form-grid">
          <div class="field field--full"><label for="name">Name *</label><input id="name" required placeholder="e.g. Ramya" /></div>
          <div class="field field--full"><label for="email">Email *</label><input id="email" type="email" required placeholder="teacher@vidyavriksh.local" /></div>
          <div class="field field--full"><label for="password">Temporary password *</label><input id="password" required minlength="6" placeholder="At least 6 characters" /></div>
        </div>
        <p class="muted" style="font-size:.85rem">Share this password with the teacher — they can use it to sign in.</p>
        <div class="modal__actions">
          <button type="button" class="btn btn--ghost" onclick="closeModal('modal')">Cancel</button>
          <button type="submit" class="btn btn--primary">Add teacher</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/admin/assets/admin.js"></script>
  <script>
    let me;
    async function load() {
      const teachers = await api("/api/teachers");
      const rows = document.getElementById("rows");
      rows.innerHTML = teachers.map(t => `
        <tr>
          <td><strong>${escapeHtml(t.name)}</strong>${t.id === me.id ? ' <span class="pill pill--muted">you</span>' : ''}</td>
          <td>${escapeHtml(t.email)}</td>
          <td>${t.students}</td>
          <td class="actions">${t.id === me.id ? '' : `<button class="btn btn--danger btn--sm" onclick="del(${t.id},'${escapeHtml(t.name).replace(/'/g,"\\'")}')">✕ Remove</button>`}</td>
        </tr>`).join("");
    }
    window.del = async (id, name) => {
      if (!confirm(`Remove teacher ${name}? Their students and marks will also be removed.`)) return;
      try { await api(`/api/teachers/${id}`, { method: "DELETE" }); toast("Teacher removed"); load(); }
      catch (ex) { toast(ex.error || "Could not remove", true); }
    };
    document.getElementById("addBtn").addEventListener("click", () => openModal("modal"));
    document.getElementById("teacherForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const body = { name: document.getElementById("name").value, email: document.getElementById("email").value, password: document.getElementById("password").value };
      try { await api("/api/teachers", { method: "POST", body }); closeModal("modal"); e.target.reset(); toast("Teacher added"); load(); }
      catch (ex) { toast(ex.error || "Could not add", true); }
    });
    (async () => { me = await initShell("/admin/teachers.html"); if (me) load(); })();
  </script>
</body>
</html>
