<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Teachers — Vidya Vriksh Portal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B3%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/assets/admin.css" />
</head>
<body>
  <div class="wrap">
    <div class="page-head">
      <div><h1 data-i18n="a.teachers.title">Teachers</h1><p data-i18n="a.teachers.sub">Anyone here can add another teacher. Each teacher manages their own students.</p></div>
      <button class="btn btn--primary" id="addBtn" data-i18n="a.addTeacher">+ Add Teacher</button>
    </div>

    <div class="table-card">
      <div class="table-wrap">
        <table class="data">
          <thead><tr><th data-i18n="a.th.name">Name</th><th data-i18n="a.th.email">Email</th><th data-i18n="a.th.students">Students</th><th></th></tr></thead>
          <tbody id="rows"><tr><td colspan="4" class="empty">…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal__box">
      <h2 data-i18n="a.modal.addTeacher">Add Teacher</h2>
      <form id="teacherForm">
        <div class="form-grid">
          <div class="field field--full"><label for="name" data-i18n="a.f.nameReq">Name *</label><input id="name" required placeholder="e.g. Ramya" /></div>
          <div class="field field--full"><label for="email" data-i18n="a.f.teacherEmailReq">Email *</label><input id="email" type="email" required placeholder="teacher@vidyavriksh.local" /></div>
          <div class="field field--full"><label for="password" data-i18n="a.f.tempPwReq">Temporary password *</label><input id="password" required minlength="6" placeholder="At least 6 characters" /></div>
        </div>
        <p class="muted" style="font-size:.85rem" data-i18n="a.teachers.pwnote">Share this password with the teacher — they can use it to sign in.</p>
        <div class="modal__actions">
          <button type="button" class="btn btn--ghost" onclick="closeModal('modal')" data-i18n="a.cancel">Cancel</button>
          <button type="submit" class="btn btn--primary" data-i18n="a.teachers.addbtn">Add teacher</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/admin/assets/admin.js"></script>
  <script>
    let me;
    async function load() {
      const teachers = await api("/api/teachers");
      const rows = document.getElementById("rows");
      rows.innerHTML = teachers.map(t => `
        <tr>
          <td><strong>${escapeHtml(t.name)}</strong>${t.id === me.id ? ` <span class="pill pill--muted">${tr("a.you")}</span>` : ''}</td>
          <td>${escapeHtml(t.email)}</td>
          <td>${t.students}</td>
          <td class="actions">${t.id === me.id ? '' : `<button class="btn btn--danger btn--sm" onclick="del(${t.id},'${escapeHtml(t.name).replace(/'/g,"\\'")}')">${tr("a.remove")}</button>`}</td>
        </tr>`).join("");
    }
    window.del = async (id, name) => {
      const msg = aLang() === "te" ? `టీచర్ ${name}ను తొలగించాలా? వారి విద్యార్థులు, మార్కులు కూడా తొలగించబడతాయి.` : `Remove teacher ${name}? Their students and marks will also be removed.`;
      if (!confirm(msg)) return;
      try { await api(`/api/teachers/${id}`, { method: "DELETE" }); toast(aLang() === "te" ? "టీచర్ తొలగించబడ్డారు" : "Teacher removed"); load(); }
      catch (ex) { toast(ex.error || (aLang() === "te" ? "తొలగించలేకపోయాం" : "Could not remove"), true); }
    };
    document.getElementById("addBtn").addEventListener("click", () => openModal("modal"));
    document.getElementById("teacherForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const body = { name: document.getElementById("name").value, email: document.getElementById("email").value, password: document.getElementById("password").value };
      try { await api("/api/teachers", { method: "POST", body }); closeModal("modal"); e.target.reset(); toast(aLang() === "te" ? "టీచర్ చేర్చబడ్డారు" : "Teacher added"); load(); }
      catch (ex) { toast(ex.error || (aLang() === "te" ? "చేర్చలేకపోయాం" : "Could not add"), true); }
    });
    (async () => { me = await initShell("/admin/teachers"); if (me) load(); })();
  </script>
</body>
</html>
