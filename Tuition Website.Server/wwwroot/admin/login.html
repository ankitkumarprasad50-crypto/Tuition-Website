<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Teacher Login — Vidya Vriksh</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B3%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/assets/admin.css" />
</head>
<body>
  <div class="login">
    <form class="login__box" id="loginForm">
      <div class="login__logo">🌳</div>
      <h1>Teacher Portal</h1>
      <p>Sign in to manage students, tests and reports.</p>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="username" placeholder="you@vidyavriksh.local" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Your password" />
      </div>
      <button class="btn btn--primary" type="submit" id="loginBtn" style="width:100%;margin-top:.4rem">Sign in</button>
      <div class="login__err" id="err"></div>
    </form>
  </div>

  <script src="/admin/assets/admin.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const err = document.getElementById("err");
    const btn = document.getElementById("loginBtn");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.textContent = "";
      btn.disabled = true; btn.textContent = "Signing in…";
      try {
        await api("/api/auth/login", {
          method: "POST", noRedirect: true,
          body: { email: document.getElementById("email").value, password: document.getElementById("password").value },
        });
        location.href = "/admin/";
      } catch (ex) {
        err.textContent = ex.error || "Sign in failed.";
        btn.disabled = false; btn.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
