<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Tests — Vidya Vriksh Portal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B3%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/assets/admin.css" />
</head>
<body>
  <div class="wrap">
    <div class="page-head">
      <div><h1 data-i18n="a.tests.title">Tests</h1><p data-i18n="a.tests.sub">Create tests, then record each student's marks from their page.</p></div>
      <button class="btn btn--primary" id="addBtn" data-i18n="a.addTest">+ Add Test</button>
    </div>

    <div class="table-card">
      <div class="table-wrap">
        <table class="data">
          <thead><tr><th data-i18n="a.th.test">Test</th><th data-i18n="a.th.subject">Subject</th><th data-i18n="a.th.date">Date</th><th data-i18n="a.th.maxmarks">Max marks</th><th></th></tr></thead>
          <tbody id="rows"><tr><td colspan="5" class="empty">…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal__box">
      <h2 data-i18n="a.modal.addTest">Add Test</h2>
      <form id="testForm">
        <div class="form-grid">
          <div class="field"><label for="name" data-i18n="a.f.testNameReq">Test name *</label><input id="name" required placeholder="e.g. Unit Test 1" /></div>
          <div class="field"><label for="subject" data-i18n="a.f.subject">Subject</label>
            <select id="subject"><option value="">—</option><option>Mathematics</option><option>English</option><option>Science / EVS</option><option>Social Studies</option><option>Telugu</option><option>Hindi</option><option>General</option></select></div>
          <div class="field"><label for="date" data-i18n="a.f.date">Date</label><input id="date" type="date" /></div>
          <div class="field"><label for="maxMarks" data-i18n="a.f.maxmarksLabel">Maximum marks</label><input id="maxMarks" type="number" min="1" value="100" /></div>
        </div>
        <div class="modal__actions">
          <button type="button" class="btn btn--ghost" onclick="closeModal('modal')" data-i18n="a.cancel">Cancel</button>
          <button type="submit" class="btn btn--primary" data-i18n="a.save">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/admin/assets/admin.js"></script>
  <script>
    async function load() {
      const tests = await api("/api/tests");
      const rows = document.getElementById("rows");
      if (!tests.length) { rows.innerHTML = `<tr><td colspan="5" class="empty">${tr("a.tests.none")}</td></tr>`; return; }
      rows.innerHTML = tests.map(t => `
        <tr>
          <td><strong>${escapeHtml(t.name)}</strong></td>
          <td>${escapeHtml(t.subject) || "—"}</td>
          <td>${t.date}</td>
          <td>${t.maxMarks}</td>
          <td class="actions"><button class="btn btn--danger btn--sm" onclick="del(${t.id},'${escapeHtml(t.name).replace(/'/g,"\\'")}')">${tr("a.delete")}</button></td>
        </tr>`).join("");
    }
    window.del = async (id, name) => {
      const msg = aLang() === "te" ? `“${name}”ను తొలగించాలా? దాని మార్కులు కూడా తొలగించబడతాయి.` : `Delete “${name}”? This removes its marks too.`;
      if (!confirm(msg)) return;
      await api(`/api/tests/${id}`, { method: "DELETE" });
      toast(aLang() === "te" ? "పరీక్ష తొలగించబడింది" : "Test deleted"); load();
    };
    document.getElementById("addBtn").addEventListener("click", () => {
      document.getElementById("date").value = new Date().toISOString().slice(0, 10);
      openModal("modal");
    });
    document.getElementById("testForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const body = {
        name: document.getElementById("name").value, subject: document.getElementById("subject").value,
        date: document.getElementById("date").value || null, maxMarks: parseInt(document.getElementById("maxMarks").value) || 100,
      };
      try { await api("/api/tests", { method: "POST", body }); closeModal("modal"); e.target.reset(); toast(aLang() === "te" ? "పరీక్ష చేర్చబడింది" : "Test added"); load(); }
      catch (ex) { toast(ex.error || (aLang() === "te" ? "సేవ్ చేయలేకపోయాం" : "Could not save"), true); }
    });
    (async () => { if (await initShell("/admin/tests")) load(); })();
  </script>
</body>
</html>
